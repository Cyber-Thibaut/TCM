<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tarifs et abonnements — TCM</title>
    <meta name="description" content="Tickets, abonnements et vélos : la grille tarifaire du réseau TCM." />
    <meta name="theme-color" content="#204BFE" />
    <link rel="icon" href="/img/TCM.png" />
    <link rel="apple-touch-icon" href="/img/TCM.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Transport Clermont Métropole" />
    <meta property="og:title" content="Tarifs et abonnements — TCM" />
    <meta property="og:description" content="Tickets, abonnements et vélos : la grille tarifaire du réseau TCM." />
    <meta property="og:image" content="https://tcm-mobilite.vercel.app/img/photos/ecitaro-1920.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/assets/fonts/CitroenType-Black.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/CitroenType-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/dist/output.css" />
    <script>
      try {
        var t = localStorage.getItem("tcm-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "light");
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <script src="https://kit.fontawesome.com/d8bf012a3e.js" crossorigin="anonymous" defer></script>
    <script src="/assets/js/site.js" defer></script>
    <script src="/assets/js/pages/tarifs.js" defer></script>
  </head>
  <body>
    <div id="entete-site"></div>
    <main id="contenu">
      <section class="border-b border-trait bg-carte">
        <div class="conteneur py-12 sm:py-16">
          <nav class="text-[11px] font-bold uppercase tracking-[0.18em] text-doux" aria-label="Fil d'Ariane">
            <a href="/index.html" class="hover:text-encre">Accueil</a> <span class="mx-2">/</span> <span class="text-encre">Tarifs</span>
          </nav>
          <h1 class="mt-6 text-5xl uppercase leading-[0.9] tracking-[-0.03em] sm:text-7xl">Tarifs</h1>
          <p class="mt-6 max-w-2xl text-lg text-doux">
            Un seul ticket pour le tram, les BHNS, les bus et les cars du réseau. Les tarifs sont inchangés avec le nouveau réseau.
          </p>
        </div>
      </section>
      <div class="conteneur mt-14">
        <div id="tarifs" class="space-y-16"></div>
        <div id="tarifs-notes" class="mt-16 grid gap-px border border-trait bg-trait md:grid-cols-2"></div>
        <p class="mt-6 text-xs text-doux">Tarifs en vigueur au <span id="tarifs-maj"></span>. Titres en vente dans les agences TCM.</p>
      </div>
    </main>
    <div id="pied-site"></div>
  </body>
</html>
