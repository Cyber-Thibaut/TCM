<!DOCTYPE html>
<html lang="fr">
  <head>
    <!-- Métadonnées du site -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Partenaire de vos déplacements dans Clermont-Ferrand depuis 1989."
    />
    <meta name="keywords" content="Transport, Clermont-Ferrand, Mobilité" />
    <meta name="author" content="Transport Clermont Métropole" />
    <title>Transport Clermont Métropole</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="https://tcm-mobilite.vercel.app/img/TCM.png"
    />

    <!-- Intégrations pour réseaux sociaux -->
    <meta property="og:title" content="Transport Clermont Métropole" />
    <meta
      property="og:description"
      content="Partenaire de vos déplacements dans Clermont-Ferrand depuis 1989."
    />
    <meta
      property="og:image"
      content="https://tcm-mobilite.vercel.app/img/TCM Clair.png"
    />
    <meta property="og:url" content="https://tcm-mobilite.vercel.app/" />
    <meta name="twitter:title" content="Transport Clermont Métropole" />
    <meta
      name="twitter:description"
      content="Partenaire de vos déplacements dans Clermont-Ferrand depuis 1989."
    />
    <meta
      name="twitter:image"
      content="https://tcm-mobilite.vercel.app/img/TCM Clair.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="https://kit.fontawesome.com/d8bf012a3e.js" crossorigin="anonymous"></script>
    <!-- Couleur de fond pour l'intégration -->
    <meta name="theme-color" content="#204BFE" />

    <link href="../dist/output.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="menu.js"></script>
    <script>
      document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        e.stopPropagation();
      });
      document.addEventListener("copy", function (e) {
        e.preventDefault();
        e.stopPropagation();
      });
      document.addEventListener("cut", function (e) {
        e.preventDefault();
        e.stopPropagation();
      });
    </script>
    <style>
      .jw-album-image img,
      .jw-element-image img {
        pointer-events: none;
        -webkit-touch-callout: none;
      }

      .pswp__share-tooltip .pswp__share--download {
        display: none;
      }
    </style>
  </head>

  <body>
    <br />
    <div class="container p-6">
      <h1 id="pageTitle" class="text-5xl font-bold text-center">
        Détails de la ligne
      </h1>
      <div class="divider"></div>
      <div id="details"></div>
    </div>
    <footer class="footer footer-center p-10 bg-primary text-primary-content">
      <aside>
        <img
          src="/img/TCM-Sombre.png"
          width="200"
          height="200"
          alt="Logo TCM"
          class="hidden dark:block"
        />
        <img
          src="/img/TCM-Clair.png"
          width="200"
          height="200"
          alt="Logo TCM"
          class="block dark:hidden"
        />
        <p class="font-bold">Partenaire de vos déplacements depuis 1989.</p>
        <p>Copyright © 2023 - Tous droits réservés</p>
      </aside>
    </footer>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      // Fonction pour extraire l'ID de la ligne à partir de l'URL
      function getLigneIDFromURL() {
        const url = window.location.href;
        const parts = url.split("#");
        if (parts.length > 1) {
          return parts[1];
        }
        return null;
      }

      const ligneID = getLigneIDFromURL();

      // Fonction pour afficher les détails de la ligne
      function afficherDetailsLigne() {
        if (ligneID !== null) {
          const url = "test.json";

          $.getJSON(url, function (data) {
            const ligne = data.lignes.find((l) => l.ligne === ligneID);
            const specialLines = ["805", "809", "810", "816", "713", "817"];
            
            if (ligne) {
              const imageSuffix = specialLines.includes(ligne.ligne) ? "-jo" : "";
              const cardHeader = $("<div>").addClass("mb-4 flex justify-center");
              let logoLigne;

              // En-tête spécial pour NS
              if (ligneID === "NS") {
                 $("#pageTitle").html(`
                    <div class="flex flex-col items-center gap-4 animate-fade-in">
                        <div class="bg-white/90 p-4 rounded-xl shadow-lg backdrop-blur-sm">
                            <img src="../img/Caramel Arena.png" alt="Caramel Arena" class="h-32 object-contain drop-shadow-md">
                        </div>
                        <span class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-orange-500 to-yellow-600 drop-shadow-sm mt-4 text-center">
                            PROGRAMMATION CARAMEL ARENA
                        </span>
                    </div>
                 `);
                 $("#details").addClass("max-w-4xl mx-auto");
              } else if (ligne.ligne !== "TCM") {
                logoLigne = $("<img>")
                  .attr("src", "/img/" + ligne.ligne + imageSuffix + ".png")
                  .addClass("h-16 object-contain"); // Taille ajustée
                cardHeader.append(logoLigne);
                $("#details").append(cardHeader);
                
                // Mettre à jour le titre standard
                 $("#pageTitle").text(
                  "Détails du trafic de la ligne " + ligne.ligne
                );
              } else {
                 $("#pageTitle").text("Détails des informations du réseau");
              }

              if (ligne.infos_trafic.length === 0) {
                // Ligne sans info trafic
                $("#details").append(
                  $("<div class='alert alert-success shadow-lg'>").append(
                      $("<div>").addClass("flex items-center gap-2").append(
                          $('<i class="fa-solid fa-check-circle text-xl"></i>'),
                          $("<span>").text("Aucune perturbation en cours. Le trafic est normal.")
                      )
                  )
                );
              } else {
                $.each(ligne.infos_trafic, function (j, info) {
                  // DATE FIXE POUR TEST (06/01/2026)
                  // const dateActuelle = new Date(); 
                  const dateActuelle = new Date("2026-01-06T12:00:00");

                  const dateDebut = new Date(Date.parse(info.annonce));
                  const dateFin = new Date(Date.parse(info.fin));
                  
                  // On affiche si la date de fin n'est pas passée (donc En cours ou À venir)
                  if (dateActuelle <= dateFin) {
                    const card = $("<div>").addClass(
                      "alert shadow-lg p-6 flex flex-col gap-3 relative overflow-hidden transition-all hover:shadow-xl"
                    );

                    let theme, icon, badge;
                    let isFuture = dateActuelle < dateDebut;

                    if (ligneID === "NS") {
                         // Style Spécial Arena
                         theme = "bg-gradient-to-br from-neutral to-neutral-focus text-neutral-content border-l-8 border-[#d4af37]";
                         icon = `<i class="fa-solid fa-ticket fa-2x text-[#d4af37]"></i>`;
                         badge = isFuture ? '<span class="badge badge-warning gap-2">À VENIR</span>' : '<span class="badge badge-success gap-2">CE SOIR</span>';
                    } else if (info.type.includes("travaux")) {
                      if (isFuture) {
                         theme = "alert-warning"; // Futur = Warning (Orange/Jaune)
                         icon = `<i class="fa-solid fa-hard-hat fa-xl"></i>`;
                         badge = '<span class="badge badge-warning badge-outline">Travaux à venir</span>';
                      } else {
                         theme = "alert-error"; // En cours = Rouge
                         icon = `<i class="fa-solid fa-traffic-light fa-xl"></i>`;
                         badge = '<span class="badge badge-error badge-outline">Travaux en cours</span>';
                      }
                    } else if (info.type.includes("information")) {
                      theme = "alert-info";
                      icon = `<i class="fa-solid fa-circle-info fa-xl"></i>`;
                    } else {
                      theme = "alert-warning";
                      icon = `<i class="fa-solid fa-triangle-exclamation fa-xl"></i>`;
                    }

                    if (isFuture && ligneID !== "NS") {
                        card.addClass("opacity-90 border-dashed border-2");
                    }

                    card.addClass(theme);

                    // Structure de la carte
                    const header = $("<div>").addClass("flex justify-between items-start w-full");
                    const titleArea = $("<div>").addClass("flex items-center gap-4");
                    
                    titleArea.append($(icon));
                    titleArea.append($("<h3>").addClass("text-xl font-bold").text(info.titre));
                    
                    header.append(titleArea);
                    if(badge) header.append($(badge));

                    card.append(header);

                    card.append(
                      $("<p class='text-md mt-2 opacity-90'>").html(
                        info.detail ? info.detail.replace(/\n/g, "<br>") : info.description.replace(/\n/g, "<br>")
                      )
                    );

                    const dateDebutFormatted = new Date(info.annonce).toLocaleDateString("fr-FR", {day: 'numeric', month: 'long'});
                    const dateFinFormatted = new Date(info.fin).toLocaleDateString("fr-FR", {day: 'numeric', month: 'long'});
                    
                    let dateText = `📅 Du ${dateDebutFormatted} au ${dateFinFormatted}`;
                    if (ligneID === "NS") {
                        // Pour Arena, on affiche juste la date de l'événement si c'est le même jour
                         if (dateDebutFormatted === dateFinFormatted) {
                             dateText = `📅 Le ${dateDebutFormatted}`;
                         }
                    }

                    card.append(
                      $("<div>").addClass("text-xs font-mono mt-4 opacity-75 border-t border-current/20 pt-2 flex justify-end")
                                .text(dateText)
                    );

                    $("#details").append(card);
                    $("#details").append($("<br>"));
                  }
                });
              }

            } else {
                // ... Erreur ligne inconnue ...
              $("#pageTitle").text("Ligne introuvable");
              $("#details").html("<div class='alert alert-error'>Impossible de charger les données pour l'ID : " + ligneID + "</div>");
            }
          }).fail(function() {
               $("#details").html("<div class='alert alert-error'>Erreur de chargement du fichier de données.</div>");
          });
        } else {
          $("#details").append(
            $("<p class='text-center text-error'>").text("ID de ligne non spécifié dans l'URL.")
          );
        }
      }

      afficherDetailsLigne();
    </script>
  </body>
</html>
