<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Carte en direct — TCM</title>
    <meta name="description" content="Les lignes TCM sur la carte de Clermont-Ferrand et la position estimée des tramways et des bus en ce moment." />
    <meta name="theme-color" content="#204BFE" />
    <link rel="icon" href="/img/TCM.png" />
    <link rel="apple-touch-icon" href="/img/TCM.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Transport Clermont Métropole" />
    <meta property="og:title" content="Carte en direct — TCM" />
    <meta property="og:description" content="Les lignes TCM sur la carte de Clermont-Ferrand et la position estimée des tramways et des bus en ce moment." />
    <meta property="og:image" content="https://tcm-mobilite.vercel.app/img/photos/pont-1920.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/assets/fonts/CitroenType-Black.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/CitroenType-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/dist/output.css" />
    <script>
      try {
        var t = localStorage.getItem("tcm-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "light");
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <script src="https://kit.fontawesome.com/d8bf012a3e.js" crossorigin="anonymous" defer></script>
    <script src="/assets/js/site.js" defer></script>
    <script src="/assets/js/pages/carte.js" defer></script>
  </head>
  <body>
    <div id="entete-site"></div>
    <main id="contenu">
      <style>
        .carte-vehicule {
          display: grid;
          place-items: center;
          min-width: 26px;
          height: 20px;
          padding: 0 4px;
          font:
            800 11px/1 "CitroenType",
            system-ui,
            sans-serif;
          border: 2px solid #fff;
          box-shadow: 0 0 0 1px rgba(7, 11, 26, 0.35);
          white-space: nowrap;
        }
        .leaflet-container {
          font-family: "CitroenType", system-ui, sans-serif;
          background: var(--color-carte-2, #eef0f4);
        }
        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
          border-radius: 0;
        }
        .leaflet-popup-content {
          margin: 14px 16px;
        }
      </style>
      <div class="grid border-b border-trait lg:h-[calc(100vh-6.25rem)] lg:grid-cols-[23rem_1fr]">
        <aside class="order-2 flex min-h-0 flex-col border-trait bg-carte lg:order-1 lg:border-r">
          <div class="border-b border-trait p-5">
            <p class="index-section">Carte en direct</p>
            <h1 class="mt-2 text-3xl uppercase leading-none tracking-[-0.02em]">Le réseau maintenant</h1>
            <div class="mt-4 grid grid-cols-3 gap-px border border-trait bg-trait text-center">
              <div class="bg-carte p-3">
                <p id="c-heure" class="chiffres text-xl font-black">--h--</p>
                <p class="text-[10px] font-bold uppercase tracking-[0.14em] text-doux">Heure</p>
              </div>
              <div class="bg-carte p-3">
                <p id="c-vehicules" class="chiffres text-xl font-black">0</p>
                <p class="text-[10px] font-bold uppercase tracking-[0.14em] text-doux">Véhicules</p>
              </div>
              <div class="bg-carte p-3">
                <p id="c-lignes" class="chiffres text-xl font-black">0</p>
                <p class="text-[10px] font-bold uppercase tracking-[0.14em] text-doux">Lignes</p>
              </div>
            </div>
            <form class="relative mt-4" onsubmit="return false" autocomplete="off">
              <label for="c-arret" class="sr-only">Aller à un arrêt</label>
              <input id="c-arret" type="text" placeholder="Aller à un arrêt" class="champ h-11" />
              <div id="c-arret-liste" hidden class="carte absolute inset-x-0 top-full z-[1000] max-h-[50vh] overflow-y-auto border-encre p-1"></div>
            </form>
            <div class="mt-3 flex flex-wrap gap-x-5 gap-y-2 text-sm">
              <label class="inline-flex items-center gap-2"
                ><input id="c-voir-vehicules" type="checkbox" checked class="h-4 w-4 accent-[#204BFE]" /> Véhicules</label
              >
              <label class="inline-flex items-center gap-2"><input id="c-voir-arrets" type="checkbox" checked class="h-4 w-4 accent-[#204BFE]" /> Arrêts</label>
              <label class="inline-flex items-center gap-2"><input id="c-voir-velos" type="checkbox" checked class="h-4 w-4 accent-[#204BFE]" /> Vélos</label>
            </div>
          </div>
          <div class="flex items-center justify-between px-5 pb-2 pt-4">
            <p class="surtitre">Lignes affichées</p>
            <button type="button" id="c-toutes" class="lien text-xs">Toutes</button>
          </div>
          <div id="c-familles" class="min-h-0 flex-1 overflow-y-auto px-5 pb-5"></div>
          <p class="border-t border-trait p-5 text-xs text-doux">
            <i class="fa-solid fa-circle-info mr-1"></i>Positions estimées d'après le service prévu (fréquences et temps de parcours), sans suivi GPS. Plan du
            réseau reporté sur le fond de carte de Clermont-Ferrand (OpenStreetMap).
          </p>
        </aside>
        <div id="c-carte" class="order-1 h-[70vh] min-h-[24rem] lg:order-2 lg:h-auto"></div>
      </div>
    </main>
    <div id="pied-site"></div>
  </body>
</html>
