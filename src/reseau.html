<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- Métadonnées du site -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Partenaire de vos déplacements dans Clermont-Ferrand depuis 1989.">
    <meta name="keywords" content="Transport, Clermont-Ferrand, Mobilité">
    <meta name="author" content="Transport Clermont Métropole">
    <title>Transport Clermont Métropole</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://tcm-mobilite.vercel.app/img/TCM.png">

    <!-- Intégrations pour réseaux sociaux -->
    <meta property="og:title" content="Transport Clermont Métropole">
    <meta property="og:description" content="Partenaire de vos déplacements dans Clermont-Ferrand depuis 1989.">
    <meta property="og:image" content="https://tcm-mobilite.vercel.app/img/TCM Clair.png">
    <meta property="og:url" content="https://tcm-mobilite.vercel.app/">
    
    <script src="https://kit.fontawesome.com/d8bf012a3e.js" crossorigin="anonymous"></script>
    <link href="../dist/output.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="menu.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        /* Modern Glass Theme Variables */
        :root {
            --card-glass: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.5);
            --card-hover-bg: rgba(255, 255, 255, 0.85);
            --card-hover-shadow: rgba(0, 119, 230, 0.2);
            --text-main: #1f2937;
            --text-muted: #4b5563;
        }
        
        [data-theme="dark"] {
            --card-glass: rgba(30, 41, 59, 0.4);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-hover-bg: rgba(30, 41, 59, 0.7);
            --card-hover-shadow: rgba(0, 198, 255, 0.15);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        .glass-card {
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -5px var(--card-hover-shadow);
            background: var(--card-hover-bg);
            border-color: var(--card-border);
        }

        body {
            background-color: transparent; /* Let DaisyUI or base bg handle it, but variables help */
        }
    </style>
</head>


<body class="bg-base-200 min-h-screen flex flex-col font-sans">

    <!-- DECORATION BACKGROUND (Matching other pages) -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute -top-[20%] -right-[10%] w-[50%] h-[50%] bg-primary/10 rounded-full blur-[120px] animate-pulse"></div>
        <div class="absolute top-[40%] -left-[10%] w-[40%] h-[40%] bg-secondary/10 rounded-full blur-[120px] animate-pulse" style="animation-duration: 4s;"></div>
    </div>

    <!-- Hero Section -->
    <header class="relative min-h-[40vh] flex items-center justify-center mb-12 overflow-hidden animate__animated animate__fadeIn">
        <!-- Bg Image -->
        <div class="absolute inset-0">
             <img src="https://cdn.pixabay.com/photo/2019/01/04/14/49/landscape-3913309_1280.jpg" class="w-full h-full object-cover opacity-60 dark:opacity-40">
             <div class="absolute inset-0 bg-gradient-to-b from-base-200/50 via-transparent to-base-200"></div>
        </div>

        <div class="text-center relative z-10 px-6 max-w-4xl pt-32">
            <h1 class="text-5xl md:text-6xl font-black mb-4 tracking-tight drop-shadow-sm">
                Découvrez nos <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-accent">Lignes</span>
            </h1>
            <p class="text-xl opacity-90 leading-relaxed font-medium">
                Explorez le réseau TCM. Horaires, arrêts et correspondances pour une mobilité fluide dans toute la métropole.
            </p>
        </div>
    </header>

    <!-- Liste des Lignes -->
    <section class="container mx-auto px-6 pb-20">
        
        <!-- Conteneur des types de lignes -->
        <div id="ligne-groupes" class="space-y-16">
            <!-- Les groupes de lignes seront générés ici -->
            <div class="flex justify-center w-full py-10"><span class="loading loading-dots loading-lg text-primary"></span></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer footer-center p-10 text-base-content/50 mt-auto">
        <aside>
            <div class="opacity-50">
                 <img src="https://tcm-mobilite.vercel.app/img/TCM-Clair.png" width="120" alt="Logo TCM">
            </div>
            <p class="font-bold mt-2">Partenaire de vos déplacements depuis 1989.</p>
            <p>© <script>document.write(new Date().getFullYear())</script> - TCM Mobilité</p>
        </aside>
    </footer>

    <script>
        // Liste des types de lignes à ne PAS afficher
        const typesExclus = ["JO", "Spéciale", "Navette Arena"]; 

        async function chargerDonneesLignes() {
            try {
                const response = await fetch('ligne.json');
                const data = await response.json();
                return Array.isArray(data.lignes) ? data.lignes : [];
            } catch (error) {
                console.error("Erreur de chargement des lignes : ", error);
                return [];
            }
        }

        async function genererCartesLignes() {
            try {
                const lignesData = await chargerDonneesLignes();
                const container = document.getElementById("ligne-groupes");
                container.innerHTML = ""; // Clear loader
    
                // --- 1. BOUTON CARAMEL ARENA (Dispositif Exceptionnel) ---
                const arenaSection = document.createElement("div");
                arenaSection.classList.add("animate__animated", "animate__fadeInUp");
    
                const arenaTitle = document.createElement("div");
                arenaTitle.className = "flex items-center gap-3 mb-6";
                arenaTitle.innerHTML = `<span class="h-8 w-1 bg-warning rounded-full"></span><h3 class="text-2xl font-bold uppercase tracking-wide">Dispositif Événementiel</h3>`;
    
                const arenaCard = document.createElement("a");
                arenaCard.href = "ligne.html#NS";
                // Custom Glass for Special Events
                arenaCard.className = "glass-card block p-6 rounded-2xl relative overflow-hidden group border-l-4 border-l-warning";
                
                arenaCard.innerHTML = `
                    <div class="absolute -right-10 -top-10 w-64 h-64 bg-warning/10 rounded-full blur-3xl group-hover:bg-warning/20 transition-all"></div>
                    
                    <div class="flex flex-col md:flex-row items-center justify-between gap-8 relative z-10">
                        <div class="flex items-center gap-6">
                            <div class="bg-white p-3 rounded-xl shadow-inner shrink-0">
                                <img src="../img/Caramel Arena.png" alt="Logo Arena" class="w-16 h-16 object-contain"> 
                            </div>
                            <div class="text-center md:text-left">
                                <h3 class="text-3xl font-black text-warning mb-1">Caramel Arena</h3>
                                <p class="opacity-70 font-medium">Hub des Navettes & Infos Concerts</p>
                            </div>
                        </div>
                        
                        <button class="btn btn-warning btn-outline rounded-full px-8 group-hover:bg-warning group-hover:text-black transition-all">
                            Voir le dispositif <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
                        </button>
                    </div>
                `;
    
                arenaSection.appendChild(arenaTitle);
                arenaSection.appendChild(arenaCard);
                container.appendChild(arenaSection);
    
                // --- 2. GROUPES DE LIGNES ---
                const groupes = {};
                lignesData.forEach(ligne => {
                    if (!typesExclus.includes(ligne.type)) {
                        if (!groupes[ligne.type]) { groupes[ligne.type] = []; }
                        groupes[ligne.type].push(ligne);
                    }
                });
    
                const typeColors = {
                    "Tram": "text-error",
                    "Bus": "text-info",
                    "Nocturne": "text-purple-400"
                };
    
                Object.keys(groupes).forEach((type, idx) => {
                    const section = document.createElement("div");
                    section.className = "animate__animated animate__fadeInUp";
                    section.style.animationDelay = (0.2 + idx * 0.1) + 's';
    
                    const colorClass = typeColors[type] || "text-primary";
                    
                    const header = document.createElement("div");
                    header.className = "flex items-center gap-3 mb-6";
                    header.innerHTML = `<span class="h-8 w-1 bg-current opacity-50 rounded-full ${colorClass}"></span><h3 class="text-2xl font-bold uppercase tracking-wide ${colorClass}">${type}</h3>`;
    
                    const grid = document.createElement("div");
                    grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5";
    
                    groupes[type].forEach(ligne => {
                        const carte = document.createElement("a");
                        carte.href = (ligne.type === "Nocturne") ? `nocturne.html#${ligne.id}` : `ligne.html#${ligne.id}`;
                        carte.className = "glass-card p-4 rounded-xl flex items-center gap-4 group cursor-pointer hover:border-primary/50";
    
                        carte.innerHTML = `
                            <div class="w-14 h-12 flex items-center justify-center bg-base-100/50 rounded-lg shadow-sm group-hover:scale-110 transition-transform">
                                <img src="../img/${ligne.id}.png" alt="${ligne.id}" class="max-w-full max-h-full object-contain" onerror="this.style.display='none';this.parentElement.innerHTML='${ligne.id}'">
                            </div>
                            <div>
                                <h4 class="font-bold text-lg leading-tight group-hover:text-primary transition-colors">${ligne.id === "NS" ? "Navette" : "Ligne " + ligne.id}</h4>
                                <p class="text-xs opacity-60 font-medium line-clamp-1">${ligne.nom}</p>
                            </div>
                            <div class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity -translate-x-2 group-hover:translate-x-0 duration-300">
                                <i class="fa-solid fa-chevron-right text-primary text-sm"></i>
                            </div>
                        `;
                        grid.appendChild(carte);
                    });
    
                    section.appendChild(header);
                    section.appendChild(grid);
                    container.appendChild(section);
                });
            } catch(e) {
                console.error("Error generating cards:", e);
            }
        }

        genererCartesLignes();
    </script>

</body>

</html>
